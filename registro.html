<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/registro.css"> 
    <title>RetroSpace - Crear cuenta</title>
</head>
<body>
    <header>
        <h1>RetroSpace</h1>
       <p>Tu espacio, solo tu.</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a> 
    </nav>
    
    <main>
        <div id="ContenedoraCreaCuenta">
        <h2>Crear Cuenta</h2>
        <p>Únete a nuestra comunidad digital</p>

        <form id="FormularioCreaCuenta" method="post">

        <label for="NombreUsuario">Nombre de Usuario: </label><br>
        <input type="text" id="NombreUsuario" name="NvoNombreUsuario" minlength="3"><br>

        <label for="Correo">Correo Electronico: </label><br>
        <input type="email" id="Correo" name="NvoCorreo"><br>

        <label for="Contraseña"> Contraseña: </label><br>
        <input type="password" id="Contraseña" name="NvaContraseña" minlength="8"><br>

        <label for="ConfirmarContraseña">Confirmar Contraseña: </label><br>
        <input type="password" id="ConfirmarContraseña" name="ConfirmarContraseña" minlength="8"><br>

        <input type="submit" value="CREAR CUENTA">

        </form>

        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </main>

    <footer>
    <p>RetroSpace-2026-Proyecto Escolar</p>
    </footer>
</body>
   <script src="js/registro.js"></script>
</html>
