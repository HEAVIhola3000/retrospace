<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <title>RetroSpace - Iniciar Sesion</title>
</head>
<body>
    <header>
        <h1>RetroSpace</h1>
        <p>Tu espacio, solo tu.</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="registro.html">Crear cuenta</a>
    </nav>

    <main>
        <div id="contenedorIniciarSesion">
            <h2>INICIAR SESION</h2>
            <p>!Que bueno tenerte de vuelta¡</p>

            <form id="FormularioInicioSesion" action="php/login.php" method="POST">
                <label for="Usuario">Usuario o Correo Electronico:</label><br>
                <input type="text" id="Usuario" name="Usuario" placeholder="Usuario o correo electrónico" required><br>

                <label for="Contraseña">Contraseña:</label><br>
                <input type="password" id="Contraseña" name="Contraseña" placeholder="Contraseña" required><br>

                <img class="input lock" src="includes/PwEye.png" alt="Mostrar contraseña">
                <input type="submit" value="INICIAR SESION" id="IniciarCuenta">
            </form>

            <p>¿No tienes cuenta? Registrate aqui <a href="registro.html">Crear Cuenta</a></p>
        </div>
    </main>

    <footer>
        <p>RetroSpace-2026-Proyecto Escolar</p>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
